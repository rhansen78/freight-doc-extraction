[project]
name = "freight-doc-extraction"
version = "0.1.0"
description = "Agentic freight-document extraction with a measured evaluation harness"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fde-mcp = "fde.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "evals", "tests"]
